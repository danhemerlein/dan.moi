<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400&display=swap"
      />
    </noscript>
    <link rel="stylesheet" href="/css/bundle.css" />
    <link rel="stylesheet" href="/css/404.css" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <title>dan.moi</title>
  </head>
  <body>
    <theme-toggle></theme-toggle>
    <main
      class="main-content w-full max-w-full overflow-hidden flex items-center justify-center"
    >
      <div class="container container--404 w-full max-w-full min-h-0 flex flex-col h-full">
        <div class="paragraph-container flex flex-col max-w-full">
          <p class="text-display text-center">404</p>
          <p class="text-center trigger-link-wrap"><a href="/" class="trigger-link">go home</a></p>
        </div>
        <video-element
          class="hero-image"
          src="/assets/ufo.webm"
          description="A looping animation a 3D UFO with a futuristic monochromatic color scheme."
          show-controls
        ></video-element>
      </div>
    </main>
    <script src="/js/video.js" defer></script>
    <script src="/js/theme-toggle.js" defer></script>
  </body>
</html>
