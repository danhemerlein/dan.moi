<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400&display=swap"
      />
    </noscript>
    <link rel="stylesheet" href="/css/bundle.css" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <title>dan.moi</title>
    <meta name="description" content="Dan Hemerlein's website." />

    <!-- Open Graph -->
    <meta property="og:title" content="dan hemerlein" />
    <meta property="og:description" content="Dan Hemerlein's website." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dan.moi" />
    <meta property="og:image" content="https://dan.moi/assets/share-2.jpg" />
    <meta property="og:image:alt" content="Dan Hemerlein" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="dan hemerlein" />
    <meta name="twitter:description" content="Dan Hemerlein's website." />
    <meta name="twitter:image" content="https://dan.moi/assets/share-2.jpg" />
    <meta name="twitter:image:alt" content="Dan Hemerlein" />

    <script src="/contentful-env.js"></script>
  </head>
  <body>
    <theme-toggle></theme-toggle>
    <main
      class="main-content w-full max-w-full overflow-hidden flex items-center justify-center"
    >
      <div class="container w-full max-w-full min-h-0 flex flex-col h-full">
        <div class="paragraph-container flex flex-col max-w-full">
          <p class="body-text intro-line">
            dan hemerlein is a reader first and a
            <dropdown-trigger
              class="middle-line-mobile-margin--note-taker"
              for="blog"
              bg="var(--color-panel-blog-bg)"
              bg-open="var(--color-panel-blog-bg-open)"
              body-bg="var(--color-panel-blog-body-bg)"
              focus-ring="var(--color-panel-blog-focus-ring)"
              >note taker</dropdown-trigger
            >
            second.
          </p>
          <dropdown-panel id="blog" variant="scroll">
            <blog-panel
              class="flex flex-col flex-1 min-h-0 min-w-0 w-full max-w-full overflow-hidden"
            ></blog-panel>
          </dropdown-panel>
          <p class="body-text middle-line middle-line-mobile-margin">
            he also
            <dropdown-trigger
              for="writes-code"
              bg="var(--color-panel-code-bg)"
              bg-open="var(--color-panel-code-bg-open)"
              body-bg="var(--color-panel-code-body-bg)"
              focus-ring="var(--color-panel-code-focus-ring)"
              >writes code,</dropdown-trigger
            >
            <dropdown-trigger
              for="makes-music"
              bg="var(--color-panel-music-bg)"
              bg-open="var(--color-panel-music-bg-open)"
              body-bg="var(--color-panel-music-body-bg)"
              focus-ring="var(--color-panel-music-focus-ring)"
              >makes music,</dropdown-trigger
            >

            and

            <dropdown-trigger
              class="middle-line-mobile-margin"
              for="collects-moods"
              bg="var(--color-panel-moodboard-bg)"
              bg-open="var(--color-panel-moodboard-bg-open)"
              body-bg="var(--color-panel-moodboard-body-bg)"
              focus-ring="var(--color-panel-moodboard-focus-ring)"
              >collects moods.</dropdown-trigger
            >
          </p>
          <dropdown-panel id="writes-code" variant="scroll">
            <code-panel></code-panel>
          </dropdown-panel>
          <dropdown-panel id="makes-music" variant="scroll">
            <music-panel></music-panel>
          </dropdown-panel>
          <dropdown-panel id="collects-moods" variant="scroll">
            <moodboard-panel></moodboard-panel>
          </dropdown-panel>
          <p class="body-text bottom-line">
            based in nyc and it's super trill.
          </p>
        </div>
        <video-element
          class="hero-image"
          src="/assets/ufo.webm"
          description="A looping animation a 3D UFO with a futuristic monochromatic color scheme."
          show-controls
        ></video-element>
        <video-element
          class="image-dock"
          src="/assets/saturn.webm"
          description="A looping animation the planet Saturn with a futuristic monochromatic color scheme."
          aria-hidden="true"
        ></video-element>
      </div>
    </main>
    <script src="/js/layout-debug.js" defer></script>
    <script src="/js/theme-toggle.js" defer></script>
    <script src="/js/dropdown.js" defer></script>
    <script src="/js/accessible-select.js" defer></script>
    <script src="/js/image.js" defer></script>
    <script src="/js/video.js" defer></script>
    <script src="/js/dropdown-image.js" defer></script>
    <script src="/js/contentful-graphql.js" defer></script>
    <script type="module" src="/js/blog-panel.js"></script>
    <script type="module" src="/js/code-panel.js"></script>
    <script type="module" src="/js/music-panel.js"></script>
    <script type="module" src="/js/moodboard-panel.js"></script>
    <script src="/js/dev-mode.js" defer></script>
    <script src="/js/credits.js" defer></script>
  </body>
</html>
